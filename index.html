
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>메인 페이지</title>

    <!-- Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- 전체 컨테이너 -->
    <div class="container">

        <!-- ================= HEADER ================= -->
        <header class="header">

            <!-- 로고 -->
            <div class="logo">
                <img src="assets/images/logo.png" alt="LOGO">
            </div>

            <!-- 햄버거 메뉴 -->
            <button class="menu-icon" id="menuOpen" aria-label="메뉴 열기" aria-expanded="false">
                <i data-lucide="menu"></i>
            </button>

        </header>


        <!-- ================= HERO ================= -->
        <section class="hero">
            <!-- 추후 배경 이미지 적용 -->
        </section>


        <!-- ================= SECTION 1 ================= -->
        <section class="section1">

            <div class="order-buttons">

                <button class="order-btn delivery-btn">
                    배달 주문하기
                </button>

                <div class="sub-order-buttons">

                    <button class="order-btn">
                        전화 주문
                    </button>

                    <button class="order-btn">
                        쿠폰 사용
                    </button>

                </div>

            </div>

        </section>


        <!-- ================= SECTION 2 ================= -->
        <section class="section2">

            <h2 class="section-title">
                추천 메뉴
            </h2>

            <!-- 해시태그 -->
            <div class="hashtag-list">

                <button class="hashtag active">
                    #해시태그1
                </button>

                <button class="hashtag">
                    #해시태그2
                </button>

                <button class="hashtag">
                    #해시태그3
                </button>

            </div>


            <!-- 추천 메뉴 카드 -->
            <div class="recommend-list">

                <article class="recommend-card">

                    <div class="recommend-info">
                        <span>BEST 2</span>
                        <p>떡볶이 타이틀 작성</p>
                        <button>주문하기</button>
                    </div>

                    <div class="recommend-image"></div>

                </article>


                <article class="recommend-card">

                    <div class="recommend-info">
                        <span>BEST 1</span>
                        <p>떡볶이 타이틀 작성</p>
                        <button>주문하기</button>
                    </div>

                    <div class="recommend-image"></div>

                </article>


                <article class="recommend-card">

                    <div class="recommend-info">
                        <span>BEST 3</span>
                        <p>떡볶이 타이틀 작성</p>
                        <button>주문하기</button>
                    </div>

                    <div class="recommend-image"></div>

                </article>

            </div>

        </section>


        <!-- ================= SECTION 3 ================= -->
        <section class="section3">

            <h2 class="section-title">
                메뉴
            </h2>

            <!-- 메뉴 탭 -->
            <div class="hashtag-list">

                <button class="hashtag active">
                    탭메뉴 1
                </button>

                <button class="hashtag">
                    탭메뉴 2
                </button>

                <button class="hashtag">
                    탭메뉴 3
                </button>

            </div>


            <!-- 메뉴 콘텐츠 -->
            <div class="menu-list">

                <article class="menu-card">
                    <div class="menu-image"></div>
                    <p>떡볶이 타이틀 작성</p>
                </article>

                <article class="menu-card">
                    <div class="menu-image"></div>
                    <p>떡볶이 타이틀 작성</p>
                </article>

                <article class="menu-card">
                    <div class="menu-image"></div>
                    <p>떡볶이 타이틀 작성</p>
                </article>

                <article class="menu-card">
                    <div class="menu-image"></div>
                    <p>떡볶이 타이틀 작성</p>
                </article>

            </div>

        </section>


        <!-- ================= SECTION 4 ================= -->
        <section class="section4">

            <h2 class="section-title">
                이벤트
            </h2>

            <p class="event-description">
                매달 추가되는 입덕볶이의 이벤트를 만나보세요!
            </p>


            <!-- 이벤트 탭 -->
            <div class="event-tabs">

                <button class="event-tab active">
                    진행중
                </button>

                <button class="event-tab">
                    종료
                </button>

                <button class="event-tab">
                    당첨자
                </button>

            </div>


            <!-- 이벤트 콘텐츠 -->
            <div class="event-list">

                <article class="event-card">

                    <div class="event-image"></div>

                    <div class="event-info">

                        <p class="event-subtitle">
                            [할인중 이벤트]
                        </p>

                        <p class="event-title">
                            매달 추가되는 입덕볶이의 이벤트 내역입니다
                            자세한 내용은 이벤..
                        </p>

                        <p class="event-date">
                            2026.11.23 - 2026.12.31
                        </p>

                    </div>

                </article>

            </div>

        </section>

    </div>


    <!-- ================= SIDE MENU ================= -->

    <!-- 메뉴 외부 배경 -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- 오른쪽 슬라이드 메뉴 -->
    <nav class="side-menu" id="sideMenu" aria-label="전체 메뉴" aria-hidden="true">

        <ul class="side-menu-list">

            <li>
                <a href="Sub/lists/list.html">리스트 페이지</a>
            </li>

            <li>
                <a href="Sub/detail/detail.html">상세 페이지</a>
            </li>

            <li>
                <a href="Sub/payment/payments.html">결제 페이지</a>
            </li>

            <li>
                <a href="Sub/payment_finish/payments_finish.html">결제 완료</a>
            </li>

        </ul>

    </nav>


    <!-- ================= JAVASCRIPT ================= -->
    <script>

        // Lucide 아이콘 실행
        lucide.createIcons();


        // 메뉴 요소 가져오기
        const menuOpen = document.getElementById('menuOpen');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');


        // 메뉴 열기
        function openMenu() {

            sideMenu.classList.add('active');
            menuOverlay.classList.add('active');

            document.body.classList.add('menu-open');

            menuOpen.setAttribute('aria-expanded', 'true');
            sideMenu.setAttribute('aria-hidden', 'false');

        }


        // 메뉴 닫기
        function closeMenu() {

            sideMenu.classList.remove('active');
            menuOverlay.classList.remove('active');

            document.body.classList.remove('menu-open');

            menuOpen.setAttribute('aria-expanded', 'false');
            sideMenu.setAttribute('aria-hidden', 'true');

        }


        // 햄버거 버튼 클릭
        menuOpen.addEventListener('click', function() {

            if (sideMenu.classList.contains('active')) {
                closeMenu();
            } else {
                openMenu();
            }

        });


        // 메뉴 외부 배경 클릭 시 닫기
        menuOverlay.addEventListener('click', closeMenu);


        // ESC 키로 메뉴 닫기
        document.addEventListener('keydown', function(event) {

            if (event.key === 'Escape') {
                closeMenu();
            }

        });

    </script>

</body>
</html>
