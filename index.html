
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 페이지</title>

    <!-- Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <a href="Img/로고.png">
                <img src="assets/images/logo.png" alt="로고">
            </a>
        </div>

        <button class="menu-button" id="menuOpen" aria-label="메뉴 열기" aria-expanded="false">
            <i data-lucide="menu"></i>
        </button>
    </header>


<!-- HERO SECTION -->
<section class="hero-section">

    <div class="hero-slider" id="heroSlider">

        <div class="hero-slide">
            <img src="Img/불닭 치즈.png" alt="첫 번째 광고">
        </div>

        <div class="hero-slide">
            <img src="Img/통 오징어.png" alt="두 번째 광고">
        </div>

    </div>

    <div class="hero-pagination">
        <span id="currentSlide">01</span>
        <span class="pagination-divider">/</span>
        <span id="totalSlides">02</span>
    </div>

</section>


    <!-- SECTION 1 -->
    <section class="section1">

        <button class="main-button">배달</button>
        <button class="main-button">포장</button>
        <button class="main-button">쿠폰</button>

    </section>


    <!-- SECTION 2 -->
    <section class="section2">

        <h2 class="section-title">추천메뉴</h2>

        <!-- 해시태그 버튼 -->
        <div class="hashtag-list">
            <button class="hashtag-button active">#추천메뉴1</button>
            <button class="hashtag-button">#추천메뉴2</button>
            <button class="hashtag-button">#추천메뉴3</button>
        </div>

        <!-- 추천 메뉴 콘텐츠 -->
        <div class="recommend-list">

            <div class="recommend-item">
                <div class="recommend-image"></div>
            </div>

            <div class="recommend-item">
                <div class="recommend-image"></div>
            </div>

            <div class="recommend-item">
                <div class="recommend-image"></div>
            </div>

        </div>

    </section>


    <!-- SECTION 3 -->
    <section class="section3">

        <h2 class="section-title">메뉴</h2>

        <!-- 탭 메뉴 -->
        <div class="hashtag-list">
            <button class="hashtag-button active">탭메뉴 1</button>
            <button class="hashtag-button">탭메뉴 2</button>
            <button class="hashtag-button">탭메뉴 3</button>
        </div>

        <!-- 메뉴 콘텐츠 -->
        <div class="menu-content">

            <div class="menu-item">
                <div class="menu-image"></div>
                <p class="menu-title">콘텐츠 타이틀</p>
            </div>

        </div>

    </section>

</div>


<!-- MENU OVERLAY -->
<div class="menu-overlay" id="menuOverlay"></div>


<!-- SIDE MENU -->
<nav class="side-menu" id="sideMenu" aria-label="전체 메뉴" aria-hidden="true">

    <ul class="side-menu-list">
        <li><a href="#">리스트 페이지</a></li>
        <li><a href="#">상세 페이지</a></li>
        <li><a href="#">결제 페이지</a></li>
        <li><a href="#">결제</a></li>
    </ul>

</nav>


<!-- JAVASCRIPT -->
<script>

    // Lucide 아이콘
    lucide.createIcons();


    // 햄버거 메뉴
    const menuOpen = document.getElementById('menuOpen');
    const sideMenu = document.getElementById('sideMenu');
    const menuOverlay = document.getElementById('menuOverlay');


    function openMenu() {
        sideMenu.classList.add('active');
        menuOverlay.classList.add('active');

        document.body.classList.add('menu-open');

        menuOpen.setAttribute('aria-expanded', 'true');
        sideMenu.setAttribute('aria-hidden', 'false');
    }


    function closeMenu() {
        sideMenu.classList.remove('active');
        menuOverlay.classList.remove('active');

        document.body.classList.remove('menu-open');

        menuOpen.setAttribute('aria-expanded', 'false');
        sideMenu.setAttribute('aria-hidden', 'true');
    }


    menuOpen.addEventListener('click', function () {
        if (sideMenu.classList.contains('active')) {
            closeMenu();
        } else {
            openMenu();
        }
    });


    menuOverlay.addEventListener('click', closeMenu);


    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            closeMenu();
        }
    });



    // HERO 광고 슬라이드
    const heroSlider = document.getElementById('heroSlider');
    const currentSlide = document.getElementById('currentSlide');

    const totalSlideCount = 2;
    let slideIndex = 0;


    function changeSlide() {

        slideIndex++;

        if (slideIndex >= totalSlideCount) {
            slideIndex = 0;
        }

        heroSlider.style.transform = `translateX(-${slideIndex * 100}%)`;

        currentSlide.textContent = String(slideIndex + 1).padStart(2, '0');

    }


    // 4초마다 광고 자동 전환
    setInterval(changeSlide, 4000);


</script>

</body>
</html>
