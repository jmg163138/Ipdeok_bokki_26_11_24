<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입덕볶이 - 장바구니</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <!-- 뒤로가기 -> 메인 페이지 -->
    <header class="header">
      <a href="../../index.html" class="icon-btn" aria-label="메인으로 돌아가기">
        <i data-lucide="chevron-left"></i>
      </a>
      <h1 class="header-title">장바구니</h1>
      <button type="button" class="menu-btn" id="menuOpenBtn" aria-label="메뉴 열기">
        <i data-lucide="menu"></i>
      </button>
    </header>

    <!-- 슬라이드 메뉴 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <nav class="side-drawer" id="sideDrawer" aria-hidden="true">
      <div class="side-drawer-inner">
        <div class="drawer-header">
          <button type="button" class="close-btn" id="menuCloseBtn" aria-label="메뉴 닫기">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="drawer-user-header" id="drawerUserInfo">로그인하고 더 편하게 주문해보세요</div>
        <ul class="drawer-menu">
          <li><a href="../lists/list.html">떡볶이 메뉴</a></li>
          <li><a href="../about/about.html">소개</a></li>
          <li><a href="../community/community.html">커뮤니티</a></li>
          <li id="drawerAuthItem"><a href="../login/login.html" id="drawerAuthLink">로그인</a></li>
        </ul>
      </div>
    </nav>

    <main class="sub-main cart-main">
      <div id="cartListArea"></div>

      <!-- 메뉴 더 담으러 가기 -> 떡볶이 메뉴 화면 -->
      <div class="add-more-wrap">
        <a href="../lists/list.html" class="add-more-btn" id="addMoreMenuBtn">+ 메뉴 더 담으러 가기</a>
      </div>

      <div class="price-summary-box" id="priceSummaryBox">
        <div class="summary-row">
          <span>총 주문금액</span>
          <strong id="totalProductPrice">0원</strong>
        </div>
        <div class="summary-row">
          <span>배달팁</span>
          <span id="deliveryFee">3,000원</span>
        </div>
        <div class="summary-row total">
          <span>결제 예정금액</span>
          <strong id="finalOrderPrice">0원</strong>
        </div>
      </div>

      <!-- 결제하기 -> 결제 화면 -->
      <div class="bottom-fixed-bar">
        <a href="../payment/payments.html" class="primary-action-btn full" id="goCheckoutBtn">결제하기</a>
      </div>
    </main>

    <div class="toast-msg" id="toastMsg">로그아웃되었습니다.</div>
  </div>

  <script>
    lucide.createIcons();

    function getLoggedInUser() {
      return JSON.parse(localStorage.getItem('tteokbokki_user') || 'null');
    }

    function showToast(text) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function renderDrawerAuthState() {
      const user = getLoggedInUser();
      const drawerUserInfo = document.getElementById('drawerUserInfo');
      const drawerAuthItem = document.getElementById('drawerAuthItem');

      if (user && user.id) {
        drawerUserInfo.textContent = `${user.id}님`;
        drawerUserInfo.classList.add('logged-in');
        drawerAuthItem.innerHTML = '<button type="button" class="drawer-logout-btn" id="drawerLogoutBtn">로그아웃</button>';
        document.getElementById('drawerLogoutBtn').addEventListener('click', () => {
          localStorage.removeItem('tteokbokki_user');
          renderDrawerAuthState();
          showToast('로그아웃되었습니다.');
        });
      } else {
        drawerUserInfo.textContent = '로그인하고 더 편하게 주문해보세요';
        drawerUserInfo.classList.remove('logged-in');
        drawerAuthItem.innerHTML = '<a href="../login/login.html" id="drawerAuthLink">로그인</a>';
      }
    }

    function getCart() {
      return JSON.parse(localStorage.getItem('tteokbokki_cart') || '[]');
    }

    function saveCart(cart) {
      localStorage.setItem('tteokbokki_cart', JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      const cart = getCart();
      const cartListArea = document.getElementById('cartListArea');
      const priceSummaryBox = document.getElementById('priceSummaryBox');
      const goCheckoutBtn = document.getElementById('goCheckoutBtn');

      if (cart.length === 0) {
        cartListArea.innerHTML = `
          <div class="empty-cart-box">
            <p>장바구니에 담긴 메뉴가 없습니다.</p>
          </div>
        `;
        priceSummaryBox.style.display = 'none';
        goCheckoutBtn.setAttribute('aria-disabled', 'true');
        goCheckoutBtn.classList.add('disabled-btn');
        return;
      }

      priceSummaryBox.style.display = 'block';
      goCheckoutBtn.removeAttribute('aria-disabled');
      goCheckoutBtn.classList.remove('disabled-btn');

      cartListArea.innerHTML = cart.map((item, index) => `
        <div class="cart-item-card">
          <div class="cart-item-thumb">
            <img src="${item.img}" alt="${item.name}">
          </div>
          <div class="cart-item-info">
            <div class="cart-item-top">
              <p class="cart-item-name">${item.name}</p>
              <button type="button" class="remove-item-btn" data-index="${index}" aria-label="삭제">
                <i data-lucide="x"></i>
              </button>
            </div>
            <p class="cart-item-price">${(item.price * item.qty).toLocaleString()}원</p>
            <div class="qty-control small">
              <button type="button" class="cart-minus" data-index="${index}">-</button>
              <span>${item.qty}</span>
              <button type="button" class="cart-plus" data-index="${index}">+</button>
            </div>
          </div>
        </div>
      `).join('');

      const productTotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const delivery = 3000;
      document.getElementById('totalProductPrice').textContent = `${productTotal.toLocaleString()}원`;
      document.getElementById('finalOrderPrice').textContent = `${(productTotal + delivery).toLocaleString()}원`;

      lucide.createIcons();

      cartListArea.querySelectorAll('.cart-minus').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.index);
          if (cart[idx].qty > 1) {
            cart[idx].qty -= 1;
            saveCart(cart);
          }
        });
      });

      cartListArea.querySelectorAll('.cart-plus').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.index);
          cart[idx].qty += 1;
          saveCart(cart);
        });
      });

      cartListArea.querySelectorAll('.remove-item-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.index);
          cart.splice(idx, 1);
          saveCart(cart);
        });
      });
    }

    document.getElementById('addMoreMenuBtn').addEventListener('click', () => {
      sessionStorage.setItem('lists_back_to_cart', 'true');
    });

    document.getElementById('goCheckoutBtn').addEventListener('click', (e) => {
      const cart = getCart();
      if (cart.length === 0) {
        e.preventDefault();
        alert('장바구니에 메뉴를 먼저 담아주세요.');
      }
    });

    const menuOpenBtn = document.getElementById('menuOpenBtn');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');

    menuOpenBtn.addEventListener('click', () => {
      renderDrawerAuthState();
      sideDrawer.classList.add('open');
      drawerOverlay.classList.add('open');
    });
    menuCloseBtn.addEventListener('click', () => {
      sideDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    });
    drawerOverlay.addEventListener('click', () => {
      sideDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    });

    renderDrawerAuthState();
    renderCart();
  </script>
</body>
</html>
