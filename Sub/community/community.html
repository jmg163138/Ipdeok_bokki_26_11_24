<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입덕볶이 - 커뮤니티</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <!-- 뒤로가기 -> 메인 페이지 -->
    <header class="header">
      <a href="../../index.html" class="icon-btn" aria-label="메인으로 돌아가기">
        <i data-lucide="chevron-left"></i>
      </a>
      <h1 class="header-title">커뮤니티</h1>
      <div class="header-actions">
        <a href="../cart/cart.html" class="cart-btn" aria-label="장바구니">
          <i data-lucide="shopping-cart"></i>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button type="button" class="menu-btn" id="menuOpenBtn" aria-label="메뉴 열기">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <!-- 슬라이드 메뉴 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <nav class="side-drawer" id="sideDrawer" aria-hidden="true">
      <div class="side-drawer-inner">
        <div class="drawer-header">
          <button type="button" class="close-btn" id="menuCloseBtn" aria-label="메뉴 닫기">
            <i data-lucide="x"></i>
          </button>
        </div>
        <ul class="drawer-menu">
          <li><a href="../lists/lists.html">떡볶이 메뉴</a></li>
          <li><a href="../about/about.html">소개</a></li>
          <li><a href="community.html">커뮤니티</a></li>
          <li><a href="../login/login.html">로그인</a></li>
        </ul>
      </div>
    </nav>

    <main class="sub-main">
      <div class="info-card">
        <span class="info-badge">공지사항</span>
        <h2 class="info-title">로제 & 마라 떡볶이 출시 안내</h2>
        <p class="info-desc">꾸덕한 크림 소스의 로제 떡볶이와 얼큰한 마라 떡볶이를 지금 바로 만나보세요.</p>
      </div>

      <div class="info-card">
        <span class="info-badge">꿀조합 후기</span>
        <h3 class="info-subtitle">오리지널 떡볶이 + 모듬튀김 조합 추천!</h3>
        <p class="info-desc">소스에 김말이랑 오징어튀김 찍어 먹으면 순삭입니다. 보통맛이 딱 좋았어요.</p>
      </div>

      <div class="info-card">
        <span class="info-badge">고객 소통</span>
        <h3 class="info-subtitle">포장 주문 시 쿨피스 서비스 안내</h3>
        <p class="info-desc">매장 방문 포장 주문 고객님께 시원한 쿨피스를 함께 챙겨드립니다.</p>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const cart = JSON.parse(localStorage.getItem('tteokbokki_cart') || '[]');
    const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
    const badge = document.getElementById('cartBadge');
    if (badge) {
      badge.textContent = totalCount;
      badge.style.display = totalCount > 0 ? 'flex' : 'none';
    }

    const menuOpenBtn = document.getElementById('menuOpenBtn');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');

    menuOpenBtn.addEventListener('click', () => {
      sideDrawer.classList.add('open');
      drawerOverlay.classList.add('open');
    });
    menuCloseBtn.addEventListener('click', () => {
      sideDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    });
    drawerOverlay.addEventListener('click', () => {
      sideDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    });
  </script>
</body>
</html>
