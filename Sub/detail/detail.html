<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입덕볶이 - 메뉴 상세</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <!-- 뒤로가기 -> 이전 페이지(없으면 메인) -->
    <header class="header">
      <button type="button" class="icon-btn" id="backBtn" aria-label="뒤로가기">
        <i data-lucide="chevron-left"></i>
      </button>
      <h1 class="header-title">메뉴 상세</h1>
      <div class="header-actions">
        <a href="../cart/cart.html" class="cart-btn" aria-label="장바구니">
          <i data-lucide="shopping-bag"></i>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button type="button" class="menu-btn" id="menuOpenBtn" aria-label="메뉴 열기">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <!-- 슬라이드 메뉴 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <nav class="side-drawer" id="sideDrawer" aria-hidden="true">
      <div class="side-drawer-inner">
        <div class="drawer-header">
          <button type="button" class="close-btn" id="menuCloseBtn" aria-label="메뉴 닫기">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="drawer-user-header" id="drawerUserInfo">로그인하고 나만의 떡볶이 취향을 저장해보세요</div>
        <ul class="drawer-menu">
          <li><a href="../lists/list.html">떡볶이 메뉴</a></li>
          <li><a href="../coupon/coupon.html">쿠폰함</a></li>
          <li><a href="../about/about.html">소개</a></li>
          <li><a href="../community/community.html">커뮤니티</a></li>
          <li id="drawerAuthItem"><a href="../login/login.html" id="drawerAuthLink">로그인</a></li>
        </ul>
      </div>
    </nav>

    <main class="detail-main">
      <div class="detail-img-box">
        <img id="detailImg" src="" alt="메뉴 이미지">
      </div>
      <div class="detail-content">
        <h2 class="detail-title" id="detailTitle">메뉴명</h2>
        <p class="detail-desc" id="detailDesc">메뉴 설명</p>
        <div class="detail-price" id="detailPrice">0원</div>

        <!-- 맵기 옵션 선택 -->
        <div class="detail-option-box">
          <div class="option-header-row">
            <span class="option-label">맵기 선택</span>
            <span class="option-sub-text">단계별 맵기 설명을 확인하세요</span>
          </div>
          <div class="hashtag-group" id="spiceGroup">
            <button type="button" class="tag-btn active" data-spice="순한맛">순한맛</button>
            <button type="button" class="tag-btn" data-spice="보통맛">보통맛</button>
            <button type="button" class="tag-btn" data-spice="매운맛">매운맛</button>
          </div>
          <div class="spice-guide-box" id="spiceGuideBox">
            <strong class="spice-guide-title" id="spiceGuideTitle">순한맛</strong>
            <p class="spice-guide-desc" id="spiceGuideDesc"></p>
          </div>
        </div>

        <!-- 추가 토핑/사이드 옵션 -->
        <div class="detail-option-box">
          <div class="option-header-row">
            <span class="option-label">추가 옵션</span>
            <span class="option-sub-text">중복 선택 가능</span>
          </div>
          <div class="extra-option-list" id="extraOptionList">
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="모짜렐라 치즈" data-price="2500">
                <span>모짜렐라 치즈</span>
              </span>
              <span class="extra-option-price">+2,500원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="계란 2개" data-price="1500">
                <span>계란 2개</span>
              </span>
              <span class="extra-option-price">+1,500원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="모듬튀김 추가" data-price="3500">
                <span>모듬튀김 추가</span>
              </span>
              <span class="extra-option-price">+3,500원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="중국당면 추가" data-price="2000">
                <span>중국당면 추가</span>
              </span>
              <span class="extra-option-price">+2,000원</span>
            </label>
          </div>
        </div>

        <!-- 수량 선택 -->
        <div class="detail-qty-box">
          <span class="option-label">수량</span>
          <div class="qty-control">
            <button type="button" id="minusBtn" aria-label="수량 감소">-</button>
            <span id="qtyVal">1</span>
            <button type="button" id="plusBtn" aria-label="수량 증가">+</button>
          </div>
        </div>

        <!-- 총 상품 금액 -->
        <div class="detail-total-box">
          <span>총 주문 금액</span>
          <strong id="detailTotalPrice">0원</strong>
        </div>
      </div>

      <!-- 장바구니 담기 / 바로 결제 -->
      <div class="bottom-fixed-bar">
        <button type="button" class="sub-action-btn" id="addCartBtn">장바구니 담기</button>
        <button type="button" class="primary-action-btn" id="buyNowBtn">바로 결제</button>
      </div>
    </main>

    <div class="toast-msg" id="toastMsg">장바구니에 담았습니다.</div>
  </div>

  <script>
    lucide.createIcons();

    const menuData = [
      { id: 1, name: '입덕 오리지널 떡볶이', price: 14000, img: '../../Img/menu1.jpg', desc: '매콤달콤한 기본 양념과 쫄깃한 쌀떡의 조화' },
      { id: 2, name: '눈꽃 치즈 떡볶이', price: 16500, img: '../../Img/menu2.jpg', desc: '고소한 치즈가 듬뿍 올라간 인기 메뉴' },
      { id: 3, name: '로제 크림 떡볶이', price: 17000, img: '../../Img/menu3.jpg', desc: '부드러운 크림과 매콤함이 어우러진 로제 떡볶이' },
      { id: 4, name: '불닭 킬러 매운 떡볶이', price: 16000, img: '../../Img/menu4.jpg', desc: '스트레스가 풀리는 화끈한 매운맛' },
      { id: 5, name: '가래떡 떡볶이', price: 15000, img: '../../Img/menu5.jpg', desc: '통통한 가래떡을 썰어 넣어 씹는 맛이 일품' },
      { id: 6, name: '어묵 듬뿍 떡볶이', price: 15500, img: '../../Img/menu6.jpg', desc: '부산 어묵이 가득 들어간 감칠맛 떡볶이' },
      { id: 7, name: '바삭 모듬 튀김', price: 12000, img: '../../Img/menu7.jpg', desc: '김말이, 오징어, 고구마, 만두로 구성된 튀김 세트' },
      { id: 8, name: '국물 떡볶이 + 순대 세트', price: 19500, img: '../../Img/menu8.jpg', desc: '숟가락으로 떠먹는 국물 떡볶이와 찰순대 구성' }
    ];

    const spiceDescriptions = {
      '순한맛': '진라면 순한맛~신라면보다 훨씬 약한 수준입니다. 매운맛이 거의 느껴지지 않아 매운 음식을 잘 못 드시는 분이나 어린이도 부담 없이 드실 수 있습니다.',
      '보통맛': '신라면 기준 약간 매콤한 정도입니다. 먹다 보면 은은하게 얼큰하고 매운맛이 올라오며, 매운 음식을 무난하게 즐기시는 분께 가장 적당합니다.',
      '매운맛': '불닭볶음면 수준으로 혀가 얼얼할 만큼 확실히 매운맛입니다. 매운맛 마니아나 스트레스 해소용 매운맛을 원하시는 분께 추천합니다.'
    };

    const params = new URLSearchParams(window.location.search);
    const menuId = Number(params.get('id')) || 1;
    const selectedMenu = menuData.find((m) => m.id === menuId) || menuData[0];

    document.getElementById('detailImg').src = selectedMenu.img;
    document.getElementById('detailImg').alt = selectedMenu.name;
    document.getElementById('detailTitle').textContent = selectedMenu.name;
    document.getElementById('detailDesc').textContent = selectedMenu.desc;
    document.getElementById('detailPrice').textContent = `${selectedMenu.price.toLocaleString()}원`;

    let selectedSpice = '순한맛';
    let qty = 1;

    function getLoggedInUser() {
      return JSON.parse(localStorage.getItem('tteokbokki_user') || 'null');
    }

    function showToast(text) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function renderDrawerAuthState() {
      const user = getLoggedInUser();
      const drawerUserInfo = document.getElementById('drawerUserInfo');
      const drawerAuthItem = document.getElementById('drawerAuthItem');

      if (user && user.id) {
        drawerUserInfo.textContent = `${user.id}님`;
        drawerUserInfo.classList.add('logged-in');
        drawerAuthItem.innerHTML = '<button type="button" class="drawer-logout-btn" id="drawerLogoutBtn">로그아웃</button>';
        document.getElementById('drawerLogoutBtn').addEventListener('click', () => {
          localStorage.removeItem('tteokbokki_user');
          renderDrawerAuthState();
          showToast('로그아웃되었습니다.');
        });
      } else {
        drawerUserInfo.textContent = '로그인하고 나만의 떡볶이 취향을 저장해보세요';
        drawerUserInfo.classList.remove('logged-in');
        drawerAuthItem.innerHTML = '<a href="../login/login.html" id="drawerAuthLink">로그인</a>';
      }
    }

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('tteokbokki_cart') || '[]');
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const badge = document.getElementById('cartBadge');
      if (!badge) return;
      if (totalQty > 0) {
        badge.textContent = totalQty;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    function updateSpiceGuide() {
      document.getElementById('spiceGuideTitle').textContent = selectedSpice;
      document.getElementById('spiceGuideDesc').textContent =
        spiceDescriptions[selectedSpice] || spiceDescriptions['보통맛'];
    }

    function getSelectedExtras() {
      const checkedInputs = Array.from(
        document.querySelectorAll('#extraOptionList input[type="checkbox"]:checked')
      );
      return checkedInputs.map((input) => ({
        name: input.value,
        price: Number(input.dataset.price) || 0
      }));
    }

    function getUnitPrice() {
      const extrasTotal = getSelectedExtras().reduce((sum, extra) => sum + extra.price, 0);
      return selectedMenu.price + extrasTotal;
    }

    function updateTotalPrice() {
      const total = getUnitPrice() * qty;
      document.getElementById('detailTotalPrice').textContent = `${total.toLocaleString()}원`;
    }

    document.querySelectorAll('#spiceGroup .tag-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#spiceGroup .tag-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSpice = btn.dataset.spice;
        updateSpiceGuide();
      });
    });

    document.querySelectorAll('#extraOptionList input[type="checkbox"]').forEach((checkbox) => {
      checkbox.addEventListener('change', () => {
        const label = checkbox.closest('.extra-option-item');
        if (label) {
          label.classList.toggle('checked', checkbox.checked);
        }
        updateTotalPrice();
      });
    });

    document.getElementById('minusBtn').addEventListener('click', () => {
      if (qty > 1) {
        qty -= 1;
        document.getElementById('qtyVal').textContent = qty;
        updateTotalPrice();
      }
    });

    document.getElementById('plusBtn').addEventListener('click', () => {
      qty += 1;
      document.getElementById('qtyVal').textContent = qty;
      updateTotalPrice();
    });

    function buildCartItem() {
      const extras = getSelectedExtras();
      const extraNames = extras.map((e) => e.name);
      const optionSummary = extraNames.length > 0
        ? `${selectedSpice} · ${extraNames.join(', ')}`
        : selectedSpice;

      return {
        id: selectedMenu.id,
        name: `${selectedMenu.name} (${optionSummary})`,
        price: getUnitPrice(),
        img: selectedMenu.img,
        qty
      };
    }

    function addToCart() {
      const cart = JSON.parse(localStorage.getItem('tteokbokki_cart') || '[]');
      const newItem = buildCartItem();
      const existing = cart.find((item) => item.name === newItem.name);

      if (existing) {
        existing.qty += newItem.qty;
      } else {
        cart.push(newItem);
      }

      localStorage.setItem('tteokbokki_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    document.getElementById('addCartBtn').addEventListener('click', () => {
      addToCart();
      showToast('장바구니에 담았습니다.');
    });

    document.getElementById('buyNowBtn').addEventListener('click', () => {
      const cart = JSON.parse(localStorage.getItem('tteokbokki_cart') || '[]');
      const newItem = buildCartItem();
      const existing = cart.find((item) => item.name === newItem.name);
      if (existing) {
        existing.qty += newItem.qty;
      } else {
        cart.push(newItem);
      }
      localStorage.setItem('tteokbokki_cart', JSON.stringify(cart));
      window.location.href = '../payment/payments.html';
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '../../index.html';
      }
    });

    const menuOpenBtn = document.getElementById('menuOpenBtn');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');

    menuOpenBtn.addEventListener('click', () => {
      renderDrawerAuthState();
      sideDrawer.classList.add('open');
      drawerOverlay.classList.add('open');
    });
    menuCloseBtn.addEventListener('click', () => {
      sideDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    });
    drawerOverlay.addEventListener('click', () => {
      sideDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    });

    renderDrawerAuthState();
    updateCartBadge();
    updateSpiceGuide();
    updateTotalPrice();
  </script>
</body>
</html>
