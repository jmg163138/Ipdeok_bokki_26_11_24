<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입덕볶이 - 메뉴 상세</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <!-- 뒤로가기 -> 메인 페이지 -->
    <header class="header">
      <a href="../../index.html" class="icon-btn" aria-label="메인으로 돌아가기">
        <i data-lucide="chevron-left"></i>
      </a>
      <h1 class="header-title">메뉴 상세</h1>
      <div class="header-actions">
        <a href="../cart/cart.html" class="cart-btn" aria-label="장바구니">
          <i data-lucide="shopping-cart"></i>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button type="button" class="menu-btn" id="menuOpenBtn" aria-label="메뉴 열기">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <!-- 슬라이드 메뉴 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <nav class="side-drawer" id="sideDrawer" aria-hidden="true">
      <div class="side-drawer-inner">
        <div class="drawer-header">
          <button type="button" class="close-btn" id="menuCloseBtn" aria-label="메뉴 닫기">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="drawer-user-header" id="drawerUserInfo">로그인하고 나만의 떡볶이 취향을 저장해보세요</div>
        <ul class="drawer-menu">
          <li><a href="../lists/list.html">떡볶이 메뉴</a></li>
          <li><a href="../coupon/coupon.html">쿠폰함</a></li>
          <li><a href="../about/about.html">소개</a></li>
          <li><a href="../community/community.html">커뮤니티</a></li>
          <li id="drawerAuthItem"><a href="../login/login.html" id="drawerAuthLink">로그인</a></li>
        </ul>
      </div>
    </nav>

    <main class="detail-main">
      <div class="detail-img-box">
        <img id="detailImg" src="../../img/menu1.jpg" alt="메뉴 이미지">
      </div>

      <div class="detail-content">
        <h2 class="detail-title" id="detailTitle">오리지널 입덕볶이</h2>
        <p class="detail-desc" id="detailDesc">매콤달콤한 특제 비법 소스와 쫄깃한 밀떡이 어우러진 대표 메뉴입니다.</p>
        <p class="detail-price" id="detailPrice">14,000원</p>

        <!-- 맵기 선택 -->
        <div class="detail-option-box">
          <span class="option-label">맵기 선택</span>
          <div class="hashtag-group" id="spicyGroup">
            <button type="button" class="tag-btn active" data-spicy="순한맛">순한맛</button>
            <button type="button" class="tag-btn" data-spicy="보통맛">보통맛</button>
            <button type="button" class="tag-btn" data-spicy="매운맛">매운맛</button>
          </div>
        </div>

        <!-- 토핑 추가 (중복 선택 가능) -->
        <div class="detail-option-box">
          <div class="option-header-row">
            <span class="option-label">토핑 추가</span>
            <span class="option-sub-text">중복 선택 가능</span>
          </div>
          <div class="extra-option-list" id="toppingGroup">
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="눈꽃 치즈" data-price="3000">
                <span>눈꽃 치즈</span>
              </span>
              <span class="extra-option-price">+3,000원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="중국당면" data-price="3000">
                <span>중국당면</span>
              </span>
              <span class="extra-option-price">+3,000원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="분모자" data-price="3500">
                <span>분모자</span>
              </span>
              <span class="extra-option-price">+3,500원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="비엔나 소시지" data-price="2500">
                <span>비엔나 소시지</span>
              </span>
              <span class="extra-option-price">+2,500원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="삶은 계란 2알" data-price="1500">
                <span>삶은 계란 2알</span>
              </span>
              <span class="extra-option-price">+1,500원</span>
            </label>
          </div>
        </div>

        <!-- 사이드 추가 (중복 선택 가능) -->
        <div class="detail-option-box">
          <div class="option-header-row">
            <span class="option-label">사이드 추가</span>
            <span class="option-sub-text">선택 가능</span>
          </div>
          <div class="extra-option-list" id="sideGroup">
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="모듬 튀김 세트" data-price="6500">
                <span>모듬 튀김 세트</span>
              </span>
              <span class="extra-option-price">+6,500원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="순대 & 내장" data-price="5000">
                <span>순대 & 내장</span>
              </span>
              <span class="extra-option-price">+5,000원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="스팸 참치 주먹밥" data-price="4500">
                <span>스팸 참치 주먹밥</span>
              </span>
              <span class="extra-option-price">+4,500원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="바삭 야끼만두" data-price="4000">
                <span>바삭 야끼만두</span>
              </span>
              <span class="extra-option-price">+4,000원</span>
            </label>
          </div>
        </div>

        <!-- 음료 추가 (중복 선택 가능) -->
        <div class="detail-option-box">
          <div class="option-header-row">
            <span class="option-label">음료 추가</span>
            <span class="option-sub-text">선택 가능</span>
          </div>
          <div class="extra-option-list" id="drinkGroup">
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="쿨피스 복숭아 930ml" data-price="2500">
                <span>쿨피스 복숭아 930ml</span>
              </span>
              <span class="extra-option-price">+2,500원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="코카콜라 500ml" data-price="2000">
                <span>코카콜라 500ml</span>
              </span>
              <span class="extra-option-price">+2,000원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="칠성사이다 500ml" data-price="2000">
                <span>칠성사이다 500ml</span>
              </span>
              <span class="extra-option-price">+2,000원</span>
            </label>
            <label class="extra-option-item">
              <span class="extra-option-left">
                <input type="checkbox" value="제로 콜라 500ml" data-price="2000">
                <span>제로 콜라 500ml</span>
              </span>
              <span class="extra-option-price">+2,000원</span>
            </label>
          </div>
        </div>

        <!-- 수량 -->
        <div class="detail-qty-box">
          <span class="option-label">수량</span>
          <div class="qty-control">
            <button type="button" id="qtyMinus">-</button>
            <span id="qtyValue">1</span>
            <button type="button" id="qtyPlus">+</button>
          </div>
        </div>

        <!-- 총 선택 금액 요약 -->
        <div class="detail-total-box">
          <span>총 주문 금액</span>
          <strong id="detailTotalPrice">14,000원</strong>
        </div>
      </div>

      <div class="bottom-fixed-bar">
        <button type="button" class="sub-action-btn" id="addCartBtn">장바구니 담기</button>
        <button type="button" class="primary-action-btn" id="directOrderBtn">결제하기</button>
      </div>
    </main>

    <div class="toast-msg" id="toastMsg">장바구니에 담겼습니다.</div>
  </div>

  <script>
    lucide.createIcons();

    function getLoggedInUser() {
      return JSON.parse(localStorage.getItem('tteokbokki_user') || 'null');
    }

    function showToast(text) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function renderDrawerAuthState() {
      const user = getLoggedInUser();
      const drawerUserInfo = document.getElementById('drawerUserInfo');
      const drawerAuthItem = document.getElementById('drawerAuthItem');

      if (user && user.id) {
        drawerUserInfo.textContent = `${user.id}님`;
        drawerUserInfo.classList.add('logged-in');
        drawerAuthItem.innerHTML = '<button type="button" class="drawer-logout-btn" id="drawerLogoutBtn">로그아웃</button>';
        document.getElementById('drawerLogoutBtn').addEventListener('click', () => {
          localStorage.removeItem('tteokbokki_user');
          renderDrawerAuthState();
          showToast('로그아웃되었습니다.');
        });
      } else {
        drawerUserInfo.textContent = '로그인하고 나만의 떡볶이 취향을 저장해보세요';
        drawerUserInfo.classList.remove('logged-in');
        drawerAuthItem.innerHTML = '<a href="../login/login.html" id="drawerAuthLink">로그인</a>';
      }
    }

    const menuCatalog = {
      m1: { id: 'm1', name: '오리지널 입덕볶이', desc: '매콤달콤 기본 대표 떡볶이', price: 14000, img: '../../img/menu1.jpg' },
      m2: { id: 'm2', name: '로제 입덕볶이', desc: '부드러운 크림과 매콤 소스의 조화', price: 16000, img: '../../img/menu2.jpg' },
      m3: { id: 'm3', name: '마라 입덕볶이', desc: '얼얼한 중독성 있는 마라 풍미', price: 17000, img: '../../img/menu3.jpg' },
      m4: { id: 'm4', name: '치즈폭탄 입덕볶이', desc: '고소한 치즈가 듬뿍 올라간 떡볶이', price: 16500, img: '../../img/menu4.jpg' },
      m5: { id: 'm5', name: '모듬 튀김 세트', desc: '김말이, 오징어, 야채, 만두 튀김', price: 6500, img: '../../img/menu2-1.jpg' },
      m6: { id: 'm6', name: '순대 & 내장', desc: '쫀득한 찰순대와 모듬 내장', price: 5000, img: '../../img/menu2-2.jpg' },
      m7: { id: 'm7', name: '스팸 참치 주먹밥', desc: '고소한 스팸과 참치로 만든 주먹밥', price: 4500, img: '../../img/menu2-3.jpg' },
      m8: { id: 'm8', name: '바삭 야끼만두', desc: '소스에 찍어 먹기 좋은 바삭한 야끼만두', price: 4000, img: '../../img/menu2-4.jpg' },
      m9: { id: 'm9', name: '입덕 2인 커플 세트', desc: '떡볶이 + 모듬튀김 + 주먹밥 + 쿨피스', price: 23000, img: '../../img/menu3-1.jpg' },
      m10: { id: 'm10', name: '로제 & 튀김 세트', desc: '로제 떡볶이 + 모듬튀김 + 음료 구성', price: 24500, img: '../../img/menu3-2.jpg' },
      m11: { id: 'm11', name: '마라 & 주먹밥 세트', desc: '마라 떡볶이 + 스팸 참치 주먹밥 조합', price: 22500, img: '../../img/menu3-3.jpg' },
      m12: { id: 'm12', name: '입덕 패밀리 파티 세트', desc: '여럿이 함께 즐기는 푸짐한 패밀리 세트', price: 32000, img: '../../img/menu3-4.jpg' }
    };

    const params = new URLSearchParams(window.location.search);
    const menuId = params.get('id') || 'm1';
    const currentItem = menuCatalog[menuId] || menuCatalog.m1;

    let qty = 1;
    let selectedSpicy = '순한맛';

    document.getElementById('detailImg').src = currentItem.img;
    document.getElementById('detailTitle').textContent = currentItem.name;
    document.getElementById('detailDesc').textContent = currentItem.desc;
    document.getElementById('detailPrice').textContent = `${currentItem.price.toLocaleString()}원`;

    function getCheckedOptions(containerId) {
      const checked = Array.from(document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`));
      return checked.map((input) => ({
        name: input.value,
        price: Number(input.dataset.price)
      }));
    }

    function calculateUnitPrice() {
      const toppings = getCheckedOptions('toppingGroup');
      const sides = getCheckedOptions('sideGroup');
      const drinks = getCheckedOptions('drinkGroup');
      const extraSum = [...toppings, ...sides, ...drinks].reduce((sum, opt) => sum + opt.price, 0);
      return currentItem.price + extraSum;
    }

    function updateDetailTotalPrice() {
      const unitPrice = calculateUnitPrice();
      const total = unitPrice * qty;
      document.getElementById('detailTotalPrice').textContent = `${total.toLocaleString()}원`;
    }

    document.querySelectorAll('.extra-option-list input[type="checkbox"]').forEach((checkbox) => {
      checkbox.addEventListener('change', (e) => {
        const label = e.target.closest('.extra-option-item');
        if (label) {
          label.classList.toggle('checked', e.target.checked);
        }
        updateDetailTotalPrice();
      });
    });

    function getCart() {
      return JSON.parse(localStorage.getItem('tteokbokki_cart') || '[]');
    }

    function saveCart(cart) {
      localStorage.setItem('tteokbokki_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const totalCount = getCart().reduce((sum, item) => sum + item.qty, 0);
      const badge = document.getElementById('cartBadge');
      badge.textContent = totalCount;
      badge.style.display = totalCount > 0 ? 'flex' : 'none';
    }

    function pushItemToCart() {
      const cart = getCart();
      const toppings = getCheckedOptions('toppingGroup').map((o) => o.name);
      const sides = getCheckedOptions('sideGroup').map((o) => o.name);
      const drinks = getCheckedOptions('drinkGroup').map((o) => o.name);

      const optionParts = [selectedSpicy];
      if (toppings.length > 0) optionParts.push(`토핑: ${toppings.join(', ')}`);
      if (sides.length > 0) optionParts.push(`사이드: ${sides.join(', ')}`);
      if (drinks.length > 0) optionParts.push(`음료: ${drinks.join(', ')}`);

      const optionLabel = optionParts.join(' / ');
      const cartKey = `${currentItem.id}_${optionLabel}`;
      const unitPrice = calculateUnitPrice();
      const existing = cart.find((c) => c.id === cartKey);

      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          id: cartKey,
          name: `${currentItem.name} (${optionLabel})`,
          price: unitPrice,
          img: currentItem.img,
          qty: qty
        });
      }
      saveCart(cart);
    }

    document.querySelectorAll('#spicyGroup .tag-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#spicyGroup .tag-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSpicy = btn.dataset.spicy;
      });
    });

    document.getElementById('qtyMinus').addEventListener('click', () => {
      if (qty > 1) {
        qty -= 1;
        document.getElementById('qtyValue').textContent = qty;
        updateDetailTotalPrice();
      }
    });

    document.getElementById('qtyPlus').addEventListener('click', () => {
      qty += 1;
      document.getElementById('qtyValue').textContent = qty;
      updateDetailTotalPrice();
    });

    document.getElementById('addCartBtn').addEventListener('click', () => {
      pushItemToCart();
      showToast('장바구니에 담겼습니다.');
    });

    document.getElementById('directOrderBtn').addEventListener('click', () => {
      pushItemToCart();
      window.location.href = '../payment/payments.html';
    });

    const menuOpenBtn = document.getElementById('menuOpenBtn');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');

    menuOpenBtn.addEventListener('click', () => {
      renderDrawerAuthState();
      sideDrawer.classList.add('open');
      drawerOverlay.classList.add('open');
    });
    menuCloseBtn.addEventListener('click', () => {
      sideDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    });
    drawerOverlay.addEventListener('click', () => {
      sideDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    });

    updateDetailTotalPrice();
    updateCartBadge();
    renderDrawerAuthState();
  </script>
</body>
</html>
